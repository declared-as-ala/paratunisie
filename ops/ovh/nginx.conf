resolver 127.0.0.11 valid=10s ipv6=off;
server {
 listen 80;
 server_name _;
 return 302 https://paratunisie.54-37-226-228.sslip.io:3443$request_uri;
}
server {
 listen 443 ssl;
 server_name www.paratunisie.com;
 ssl_certificate /etc/letsencrypt/live/paratunisie.54-37-226-228.sslip.io/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/paratunisie.54-37-226-228.sslip.io/privkey.pem;
 return 301 https://paratunisie.com$request_uri;
}
server {
 listen 443 ssl;
 server_name paratunisie.54-37-226-228.sslip.io paratunisie.com;
 ssl_certificate /etc/letsencrypt/live/paratunisie.54-37-226-228.sslip.io/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/paratunisie.54-37-226-228.sslip.io/privkey.pem;
 client_max_body_size 30m;
 set $api_backend paratunisie-api:3001;
 set $media_backend paratunisie-minio:9000;
 set $web_backend paratunisie-web:3000;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 location /api/v1/ { proxy_pass http://$api_backend; }
 location /paratunisie-media/ { proxy_pass http://$media_backend; }
 location /uploads/ { proxy_pass http://$api_backend; }
 location / { proxy_pass http://$web_backend; }
}
server {
 listen 443 ssl;
 server_name admin.54-37-226-228.sslip.io admin.paratunisie.com;
 ssl_certificate /etc/letsencrypt/live/paratunisie.54-37-226-228.sslip.io/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/paratunisie.54-37-226-228.sslip.io/privkey.pem;
 client_max_body_size 30m;
 set $api_backend paratunisie-api:3001;
 set $admin_backend paratunisie-admin:3002;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 location /api/v1/ { proxy_pass http://$api_backend; }
 location /uploads/ { proxy_pass http://$api_backend; }
 location / { proxy_pass http://$admin_backend; }
}
