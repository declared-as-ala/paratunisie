name: paratunisie-ovh
networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
  usmo_proxy:
    name: usmo_usm-internal
    external: true
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
volumes:
  postgres-data-prod: null
  minio-data-prod: null
  meilisearch-data-prod: null
  redis-data-prod: null
services:
  paratunisie-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: paratunisie-web
    restart: unless-stopped
    logging: *id001
    networks:
    - edge
    - internal
    environment:
    - NODE_ENV=production
    - PORT=3000
    - API_URL=http://paratunisie-api:3001/api/v1
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://paratunisie.com/api/v1}
    depends_on:
      paratunisie-api:
        condition: service_healthy
    volumes:
    - ./public/uploads:/app/public/uploads
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3000/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  paratunisie-admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: paratunisie-admin
    restart: unless-stopped
    logging: *id001
    networks:
    - edge
    - internal
    environment:
    - NODE_ENV=production
    - PORT=3002
    - API_URL=http://paratunisie-api:3001/api/v1
    - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://paratunisie.com/api/v1}
    depends_on:
      paratunisie-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3002/admin || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  paratunisie-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: paratunisie-api
    restart: unless-stopped
    logging: *id001
    networks:
    - edge
    - internal
    env_file:
    - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-https://paratunisie.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://paratunisie.com}
      DATABASE_URL: postgresql://${POSTGRES_USER:-paratunisie}:${POSTGRES_PASSWORD}@paratunisie-postgres:5432/${POSTGRES_DB:-paratunisie}?schema=public
      MEILI_HOST: http://paratunisie-meilisearch:7700
      MEILI_API_KEY: ${MEILI_API_KEY}
      MINIO_ENDPOINT: paratunisie-minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: 'false'
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://paratunisie.com/paratunisie-media}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-dots-studio/dots-3-note-preview:free}
      AI_PROVIDER: openrouter
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    depends_on:
      paratunisie-postgres:
        condition: service_healthy
      paratunisie-redis:
        condition: service_healthy
    volumes:
    - ./public/uploads:/app/public/uploads
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3001/api/v1/catalogue/brands || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  paratunisie-postgres:
    image: postgres:16-alpine
    container_name: paratunisie-postgres
    restart: unless-stopped
    logging: *id001
    networks:
    - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paratunisie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-paratunisie}
    volumes:
    - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-paratunisie} -d ${POSTGRES_DB:-paratunisie}
      interval: 10s
      timeout: 5s
      retries: 10
  paratunisie-redis:
    image: redis:7-alpine
    container_name: paratunisie-redis
    restart: unless-stopped
    logging: *id001
    networks:
    - internal
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis-data-prod:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
  paratunisie-meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: paratunisie-meilisearch
    restart: unless-stopped
    logging: *id001
    networks:
    - internal
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY}
      MEILI_ENV: production
    volumes:
    - meilisearch-data-prod:/meili_data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:7700/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
  paratunisie-minio:
    image: minio/minio:latest
    container_name: paratunisie-minio
    restart: unless-stopped
    logging: *id001
    networks:
    - internal
    - edge
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - minio-data-prod:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 15s
      timeout: 5s
      retries: 10
  paratunisie-gateway:
    image: nginx:alpine
    container_name: paratunisie-gateway
    restart: unless-stopped
    ports:
    - 3300:80
    - 3443:443
    networks:
    - edge
    - internal
    - usmo_proxy
    volumes:
    - ./ops/ovh/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./certbot:/etc/letsencrypt:ro
    depends_on:
    - paratunisie-web
    - paratunisie-admin
    - paratunisie-api
