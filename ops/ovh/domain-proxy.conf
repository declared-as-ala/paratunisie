server {
    listen 80;
    listen [::]:80;
    server_name paratunisie.com admin.paratunisie.com www.paratunisie.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.paratunisie.com;
    ssl_certificate /etc/letsencrypt/live/paratunisie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paratunisie.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://paratunisie.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paratunisie.com admin.paratunisie.com;

    ssl_certificate /etc/letsencrypt/live/paratunisie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paratunisie.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $paratunisie_gateway paratunisie-gateway:443;

    location / {
        proxy_pass https://$paratunisie_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_name paratunisie.54-37-226-228.sslip.io;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
