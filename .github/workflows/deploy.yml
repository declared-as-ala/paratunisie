name: Fast Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: paratunisie-production
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Fast Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🌐 Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            echo "=========================================================="
            echo "🚀 Auto-deploying ParaTunisie to VPS..."
            echo "=========================================================="
            cd /opt/paratunisie/app
            
            # Fetch and reset to latest commit on main
            echo "📥 Pulling latest commits..."
            git fetch origin main
            git reset --hard origin/main
            
            # Make sure deployment script is executable
            chmod +x scripts/deploy-production.sh
            
            # Execute production deployment script
            bash scripts/deploy-production.sh
            
            echo "=========================================================="
            echo "✅ Deployment completed and containers verified healthy!"
            echo "=========================================================="
